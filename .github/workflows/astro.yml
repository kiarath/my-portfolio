name: Deploy Astro site to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fuerza la versión de Node.js a la más reciente de la rama 22 (>=22.23.4)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      # Ejecuta la instalación y compilación de Astro
      - name: Install, build, and upload site
        uses: withastro/action@v3
        env:
          SITE_URL: 'https://kiarath.github.io'
          BASE_PATH: '/my-portfolio'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
